<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="70%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4c1d95" />
    </radialGradient>

    <!-- Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.2" fill="#000000" opacity="0.35" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#halftone)" />

  <!-- Background Graphic Typography -->
  <g opacity="0.38" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" fill="#e9d5ff" transform="rotate(-6 256 256)">
    <text x="35" y="195" font-size="110" letter-spacing="-2">THE</text>
    <text x="35" y="325" font-size="135" letter-spacing="-4">MAKER</text>
  </g>

  <!-- Outer White Outline Silhouette of Designer -->
  <g filter="url(#whiteGlow)">
    <!-- White Stroke Boundary of the Figure -->
    <path d="M 120 512 
             C 125 430, 160 380, 205 350
             C 195 320, 190 280, 195 240
             C 185 240, 175 220, 178 190
             C 180 165, 195 155, 208 158
             C 215 110, 245 80, 280 75
             C 325 70, 360 95, 365 145
             C 378 150, 390 165, 388 190
             C 385 220, 375 240, 365 240
             C 370 280, 365 320, 355 350
             C 400 380, 435 430, 440 512
             Z" 
          fill="#ffffff" />
  </g>

  <!-- Figure Body (Black Sweatshirt & Cap) -->
  <g>
    <!-- Sweatshirt Torso -->
    <path d="M 130 512 
             C 135 438, 168 390, 212 360
             C 230 350, 330 350, 348 360
             C 392 390, 425 438, 430 512
             Z" 
          fill="#1c1917" />
    
    <!-- Neck & Face base tone -->
    <path d="M 215 350 C 215 250, 220 200, 256 195 C 292 200, 297 250, 297 350 Z" fill="#b48365" />

    <!-- Ears -->
    <ellipse cx="198" cy="205" rx="14" ry="24" fill="#a07155" stroke="#ffffff" stroke-width="4" />
    <ellipse cx="342" cy="205" rx="14" ry="24" fill="#a07155" stroke="#ffffff" stroke-width="4" />

    <!-- Face / Forehead tone -->
    <ellipse cx="270" cy="195" rx="52" ry="60" fill="#c99575" />

    <!-- Eyebrows and Eyes -->
    <path d="M 235 178 Q 248 172 260 178" stroke="#1c1917" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 280 178 Q 292 172 305 178" stroke="#1c1917" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="248" cy="188" r="4.5" fill="#1c1917" />
    <circle cx="292" cy="188" r="4.5" fill="#1c1917" />

    <!-- Backward Cap -->
    <path d="M 205 165 
             C 210 100, 240 78, 280 78
             C 320 78, 350 100, 355 165
             C 330 150, 230 150, 205 165
             Z" 
          fill="#0c0a09" stroke="#ffffff" stroke-width="5" />
    <!-- Cap Buckle/Strap Opening -->
    <rect x="264" y="132" width="28" height="12" rx="4" fill="#d6d3d1" />
    <circle cx="278" cy="80" r="5" fill="#292524" />

    <!-- Hands Holding Phone (Mirror Selfie) -->
    <!-- Phone Body -->
    <g filter="url(#shadow)">
      <rect x="236" y="205" width="84" height="150" rx="18" fill="#09090b" stroke="#ffffff" stroke-width="4" />
      <!-- Camera Module -->
      <rect x="244" y="215" width="38" height="42" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
      <circle cx="255" cy="226" r="6.5" fill="#000000" stroke="#71717a" stroke-width="2" />
      <circle cx="271" cy="226" r="6.5" fill="#000000" stroke="#71717a" stroke-width="2" />
      <circle cx="263" cy="245" r="6.5" fill="#000000" stroke="#71717a" stroke-width="2" />
    </g>

    <!-- Left Hand Fingers -->
    <path d="M 215 285 C 215 260, 240 240, 248 245 C 252 250, 248 270, 235 295 Z" fill="#b48365" stroke="#ffffff" stroke-width="3" />
    <path d="M 210 305 C 210 280, 244 265, 252 272 C 255 278, 246 295, 232 315 Z" fill="#c99575" stroke="#ffffff" stroke-width="3" />
    <path d="M 218 335 C 218 310, 248 295, 255 305 C 255 315, 245 330, 235 345 Z" fill="#b48365" stroke="#ffffff" stroke-width="3" />

    <!-- Right Hand Fingers -->
    <path d="M 345 285 C 345 260, 320 240, 312 245 C 308 250, 312 270, 325 295 Z" fill="#b48365" stroke="#ffffff" stroke-width="3" />
    <path d="M 350 305 C 350 280, 316 265, 308 272 C 305 278, 314 295, 328 315 Z" fill="#c99575" stroke="#ffffff" stroke-width="3" />
    <path d="M 342 335 C 342 310, 312 295, 305 305 C 305 315, 315 330, 325 345 Z" fill="#b48365" stroke="#ffffff" stroke-width="3" />

    <!-- "DESIGNER" Text on Sweatshirt -->
    <text x="280" y="405" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-weight="800" 
          font-size="19" 
          letter-spacing="4" 
          fill="#ffffff" 
          text-anchor="middle">
      DESIGNER
    </text>

    <!-- Collar / Details -->
    <path d="M 220 365 Q 280 380 340 365" stroke="#292524" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>
</svg>
